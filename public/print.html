<!doctype html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Preparazione stampa</title>
    <style>
      html, body { min-height: 100%; margin: 0; }
      body { background: #fff; }
      .print-engine-status {
        box-sizing: border-box;
        max-width: 720px;
        margin: 64px auto;
        padding: 24px;
        font: 16px/1.5 system-ui, sans-serif;
        color: #10213a;
      }
      .print-engine-error { color: #9f1239; }
      @media screen {
        body.print-engine-preparing #printRoot {
          position: fixed;
          left: -10000px;
          top: 0;
          width: 190mm;
          max-width: 190mm;
          visibility: hidden;
          pointer-events: none;
        }
      }
      @media print {
        .print-engine-status { display: none !important; }
      }
    </style>
  </head>
  <body>
    <div id="printStatus" class="print-engine-status" role="status">Preparazione del documento…</div>
    <main id="printRoot"></main>
    <script>
      (() => {
        const PREFIX = 'staff-print-payload:'
        const MAX_AGE_MS = 2 * 60 * 1000
        const MESSAGE_REQUEST = 'staff-print-request'
        const MESSAGE_PAYLOAD = 'staff-print-payload'
        const status = document.getElementById('printStatus')
        const root = document.getElementById('printRoot')

        const nextFrame = () => new Promise((resolve) => requestAnimationFrame(resolve))
        const shortPaintDelay = () => new Promise((resolve) => setTimeout(resolve, 100))
        const mobilePrintSettleDelay = () => new Promise((resolve) => setTimeout(resolve, /Android|iPhone|iPad|iPod/i.test(navigator.userAgent) ? 700 : 80))
        const waitForImages = () => Promise.all([...document.images].map((image) => {
          if (image.complete) return Promise.resolve()
          return new Promise((resolve) => {
            image.addEventListener('load', resolve, { once: true })
            image.addEventListener('error', resolve, { once: true })
          })
        }))

        const fail = (message, error) => {
          console.error('[PrintEngine]', error || message)
          status.textContent = message
          status.classList.add('print-engine-error')
        }

        function readStoredPayload(token) {
          const key = `${PREFIX}${token}`
          try {
            const raw = localStorage.getItem(key)
            if (!raw) return null
            localStorage.removeItem(key)
            return JSON.parse(raw)
          } catch (error) {
            console.warn('[PrintEngine] Storage payload non disponibile:', error)
            return null
          }
        }

        function requestPayloadFromOpener(token) {
          return new Promise((resolve) => {
            if (!window.opener || window.opener.closed) return resolve(null)

            const timeout = setTimeout(() => {
              window.removeEventListener('message', onMessage)
              resolve(null)
            }, 3000)

            const onMessage = (event) => {
              if (event.origin !== location.origin || event.source !== window.opener) return
              if (event.data?.type !== MESSAGE_PAYLOAD || event.data?.token !== token) return
              clearTimeout(timeout)
              window.removeEventListener('message', onMessage)
              resolve(event.data.payload || null)
            }

            window.addEventListener('message', onMessage)
            window.opener.postMessage({ type: MESSAGE_REQUEST, token }, location.origin)
          })
        }

        async function start() {
          const token = new URLSearchParams(location.search).get('token')
          if (!token) return fail('Documento di stampa non disponibile.')

          let payload = readStoredPayload(token)
          if (!payload) payload = await requestPayloadFromOpener(token)
          if (!payload) return fail('Il documento di stampa è scaduto o non è disponibile.')

          if (!payload?.content || Date.now() - Number(payload.createdAt || 0) > MAX_AGE_MS) {
            return fail('Il documento di stampa è scaduto.')
          }

          document.title = payload.title || 'Documento'
          if (payload.baseHref) {
            const base = document.createElement('base')
            base.href = payload.baseHref
            document.head.prepend(base)
          }
          if (payload.styles) document.head.insertAdjacentHTML('beforeend', payload.styles)

          const visibilityShield = document.createElement('style')
          visibilityShield.setAttribute('data-print-engine-shield', '')
          visibilityShield.textContent = '@media print { html, body { background:#fff !important; min-height:0 !important; } #printRoot, #printRoot * { visibility: visible !important; } #printRoot { display:block !important; position:static !important; opacity:1 !important; width:auto !important; height:auto !important; overflow:visible !important; } }'
          document.head.appendChild(visibilityShield)

          const printClass = payload.bodyClass || ''
          document.documentElement.className = printClass
          document.body.className = printClass
          document.body.classList.add('print-engine-preparing')
          root.innerHTML = payload.content
          status.textContent = 'Preparazione del documento…'

          try {
            await document.fonts?.ready
            await waitForImages()
            await nextFrame()
            await nextFrame()
            await shortPaintDelay()
            await mobilePrintSettleDelay()

            const printable = root.firstElementChild
            const rect = printable?.getBoundingClientRect()
            if (!printable || !rect || rect.width < 20 || rect.height < 20 || !printable.textContent.trim()) {
              throw new Error('Contenuto stampabile privo di dimensioni o testo')
            }

            window.addEventListener('afterprint', () => {
              if (payload.autoClose !== false) window.close()
            }, { once: true })
            window.focus()
            // Mobile print services are more fragile when invoked in the same paint tick.
            // The settle delay above lets layout/images/fonts become stable before handing off to Android/iOS.
            window.print()
          } catch (error) {
            fail('Non è stato possibile preparare il documento per la stampa.', error)
          }
        }

        if (document.readyState === 'loading') {
          document.addEventListener('DOMContentLoaded', start, { once: true })
        } else {
          start()
        }
      })()
    </script>
  </body>
</html>
